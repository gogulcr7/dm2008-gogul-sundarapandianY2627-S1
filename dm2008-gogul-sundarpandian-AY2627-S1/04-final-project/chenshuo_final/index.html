
<!DOCTYPE html>
<html lang="en">
  <head>
    <script src="https://cdn.jsdelivr.net/npm/p5@2.3.4/lib/p5.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/p5.sound@0.4.1/dist/p5.sound.min.js"></script>
    <script src="https://unpkg.com/@gohai/p5.webserial@^1/libraries/p5.webserial.js"></script>
    
    <link rel="stylesheet" type="text/css" href="style.css">
    <meta charset="utf-8" />
    <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@700&display=swap" rel="stylesheet">
    <style>
      body {
        margin: 0;
        background-color: #000;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        overflow: hidden;
      }

      /* 1. The bounding box wrapping both canvas and UI overlays */
      .sketch-container {
        position: relative;
        display: inline-block;
        width: 800px;
        height: 600px;
        box-shadow: 0 0 30px rgba(0,0,0,0.9);
      }

      /* 2. Floating Score Display */
      #score-display {
        position: absolute;
        top: 15px;
        left: 15px;
        margin: 0;
        padding: 6px 12px;
        font-family: 'Comfortaa', sans-serif;
        font-size: 18px;
        font-weight: bold;
        color: white;
        background-color: rgba(0, 0, 0, 0.6);
        border: 1px solid rgba(255, 255, 255, 0.2);
        border-radius: 4px;
        pointer-events: none;
        z-index: 5;
      }

      #brightness-display {
        position:absolute;
        top: 15px;
        right: 15px;
        margin: 0;
        padding: 6px 12px;
        font-family: 'Comfortaa', sans-serif;
        font-size: 18px;
        font-weight: bold;
        color: white;
        background-color: rgba(0, 0, 0, 0.6);
        border: 1px solid rgba(255, 255, 255, 0.2);
        border-radius: 4px;
        pointer-events: none;
        z-index: 5;
      }

      /* 3. Overlay Screens */
      .game-overlay {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-color: rgba(0, 0, 0, 0.85);
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        font-family: 'Comfortaa', sans-serif;
        color: white;
        z-index: 10;
        text-align: center;
        padding: 20px;
        box-sizing: border-box;
      }

      .game-overlay h1 {
        font-family: 'Comfortaa', sans-serif;
        font-size: 48px;
        font-weight: 700;
        margin-bottom: 25px;
        color: #ffffff;
        text-shadow: 0 0 15px rgba(255, 255, 255, 0.8), 0 0 30px rgba(255, 200, 100, 0.5);
        letter-spacing: 2px;
      }

      /* Stylized Button Containers with Divider Line Above */
      .styled-btn-container {
        display: flex;
        flex-direction: column;
        align-items: center;
        margin: 8px 0;
      }

      .line-above {
        width: 160px;
        height: 1px;
        background-color: white;
        margin-bottom: 8px;
      }

      /* Retro Framed Buttons with Corner Markers */
      .big-btn {
        position: relative;
        width: 180px;
        padding: 10px 0;
        font-family: 'Comfortaa', sans-serif;
        font-size: 16px;
        font-weight: 700;
        letter-spacing: 2px;
        background-color: transparent;
        color: white;
        border: 2px solid white;
        cursor: pointer;
        transition: all 0.2s ease;
        text-transform: uppercase;
        text-align: center;
      }

      .big-btn::before, .big-btn::after {
        content: '';
        position: absolute;
        width: 6px;
        height: 6px;
        background-color: white;
      }

      .big-btn::before {
        top: -4px;
        left: -4px;
      }

      .big-btn::after {
        bottom: -4px;
        right: -4px;
      }

      .big-btn:hover {
        background-color: white;
        color: black;
        box-shadow: 0 0 15px rgba(255, 255, 255, 0.6);
      }

      .connect-btn {
        border-color: #34d399;
      }
      .connect-btn:hover {
        background-color: #34d399;
        color: black;
      }

      .hidden {
        display: none !important;
      }
    </style>
  </head>
  <body>
    <div class="sketch-container">
      <main></main>
      <p id="score-display">Score : 0</p>
      <p id="brightness-display">Brightness : 0</p>

      <!-- Start Screen matching the reference layout -->
      <div id="start-screen" class="game-overlay">
        <h1>Lantern Keeper</h1>
        
        <div class="styled-btn-container">
          <div class="line-above"></div>
          <button class="big-btn" id="start-btn">Start</button>
        </div>

        <div class="styled-btn-container">
          <div class="line-above"></div>
          <button class="big-btn connect-btn" id="connectBtn" onclick="connectBtnClicked()">Connect</button>
        </div>

        <!-- <div class="styled-btn-container">
          <div class="line-above"></div>
          <button class="big-btn" id="exit-btn">Exit</button>
        </div> -->
      </div> 

      <!-- Game Over Screen matching the reference layout -->
      <div id="game-over-screen" class="game-overlay hidden">
        <h1>Game Over</h1>
        <p id="final-score-text" style="font-size: 16px; margin-bottom: 20px; color: #cbd5e1; font-family: sans-serif;">YOUR SCORE: 0</p>
        
        <div class="styled-btn-container">
          <div class="line-above"></div>
          <button class="big-btn" id="restart-btn">Restart</button>
        </div>
      </div>
    </div>

    <script src="sketch.js"></script>
  </body>
</html>
