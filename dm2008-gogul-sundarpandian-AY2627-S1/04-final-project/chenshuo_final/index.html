<!DOCTYPE html>
<html lang="en">
  <head>
    <script src="https://cdn.jsdelivr.net/npm/p5@2.3.4/lib/p5.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/p5.sound@0.4.1/dist/p5.sound.min.js"></script>
    
    
    
    <link rel="stylesheet" type="text/css" href="style.css">
    <meta charset="utf-8" />
    <style>
    /* 1. Make the container the bounding box for positioning */
    .sketch-container {
      position: relative;
      display: inline-block; /* Shrinks the container to wrap exactly around the canvas */
    }

    /* 2. Rip the score out of the normal layout and float it over the canvas */
    #score-display {
      position: absolute;
      top: 15px;         /* 15 pixels down from the top edge */
      left: 15px;        /* 15 pixels right from the left edge */
      margin: 0;
      padding: 5px 10px;
      
      /* Styling to make it highly readable over an active canvas */
      font-family: sans-serif;
      font-size: 20px;
      font-weight: bold;
      color: white;
      background-color: rgba(0, 0, 0, 0.5); /* Semi-transparent black box */
      border-radius: 5px;
      pointer-events: none; /* Allows mouse clicks to pass through to the canvas underneath */
    }
  </style>
  </head>
  <body>
    <main>
    </main>
    <script src="sketch.js"></script>
    <p id="score-display">score : 0</p>
  </body>
</html>
